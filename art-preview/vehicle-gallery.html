<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đường Về Nhà · vehicle art gallery</title>
  <style>
    body { margin: 0; background: #17262d; color: #eee8dc; font: 14px system-ui, sans-serif; }
    header { padding: 12px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 18px; } select { padding: 5px; background: #30464d; color: #eee8dc; border: 1px solid #738f94; }
    main { display: grid; grid-template-columns: 1.05fr 2fr; gap: 12px; padding: 0 12px 12px; height: calc(100vh - 69px); box-sizing: border-box; }
    .view { position: relative; overflow: hidden; background: #596a6d; border-radius: 6px; }
    canvas { width: 100%; height: 100%; display: block; }
    .view span { position: absolute; left: 8px; top: 8px; background: #18272dcc; padding: 3px 6px; border-radius: 3px; }
    .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
    @media(max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } .gameplay { height: 520px; } .sheet { height: 650px; } }
  </style>
</head>
<body>
  <header><h1>Vehicle art · essential pass</h1>
    <label>Xe <select id="kind"><option value="car4">Ô tô 4 chỗ</option><option value="motorcycle">Xe máy</option><option value="motorbike">Mô tô</option><option value="car7">Ô tô 7 chỗ</option><option value="tricycle">Ba gác</option><option value="bus">Buýt</option><option value="truck">Tải</option><option value="container">Container</option></select></label>
    <label>LOD <select id="lod"><option value="near">Near</option><option value="far">Far</option></select></label>
    <label>Tình trạng <select id="condition"><option value="clean">Mới</option><option value="used">Đã dùng</option><option value="damaged">Hư hại</option><option value="destroyed">Hỏng nặng</option></select></label>
  </header>
  <main>
    <div class="view gameplay"><span>Camera sau 9:16</span><canvas id="gameplay"></canvas></div>
    <div class="sheet">
      <div class="view"><span>Rear</span><canvas id="rear"></canvas></div>
      <div class="view"><span>Front</span><canvas id="front"></canvas></div>
      <div class="view"><span>Side</span><canvas id="side"></canvas></div>
      <div class="view"><span>Top</span><canvas id="top"></canvas></div>
    </div>
  </main>
  <script type="module" src="./vehicle-gallery.ts"></script>
</body>
</html>
