<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEH-03 Car4 art review</title>
    <style>
      body { margin: 0; background: #17262d; color: #e8e2d5; font: 14px system-ui, sans-serif; }
      header { padding: 16px 22px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
      h1 { font-size: 18px; margin: 0; }
      label { display: flex; gap: 7px; align-items: center; }
      select { color: #f7eee1; background: #30464d; border: 1px solid #63828a; padding: 5px; }
      main { display: grid; grid-template-columns: 1.2fr 2fr; gap: 14px; padding: 0 14px 14px; height: calc(100vh - 82px); box-sizing: border-box; }
      .view { position: relative; overflow: hidden; background: #52646a; border: 1px solid #698086; border-radius: 8px; }
      .view canvas { display: block; width: 100%; height: 100%; }
      .view span { position: absolute; left: 10px; top: 8px; padding: 4px 7px; background: #17262dcc; border-radius: 3px; }
      .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } .gameplay { height: 560px; } .sheet { height: 700px; } }
    </style>
  </head>
  <body>
    <header><h1>VEH-03 · car4 hero · art review</h1>
      <label>Sơn <select id="finish"><option value="coral">Coral</option><option value="jade">Jade</option><option value="cream">Cream</option></select></label>
      <label>Trạng thái <select id="condition"><option value="clean">Clean</option><option value="used">Used</option><option value="damaged">Damaged</option><option value="destroyed">Destroyed</option></select></label>
      <label>LOD <select id="lod"><option value="near">Near</option><option value="far">Far</option></select></label>
    </header>
    <main>
      <div class="view gameplay"><span>Góc gameplay 9:16 · camera sau</span><canvas id="gameplay"></canvas></div>
      <div class="sheet">
        <div class="view"><span>Rear</span><canvas id="rear"></canvas></div>
        <div class="view"><span>Front</span><canvas id="front"></canvas></div>
        <div class="view"><span>Side</span><canvas id="side"></canvas></div>
        <div class="view"><span>Top</span><canvas id="top"></canvas></div>
      </div>
    </main>
    <script type="module" src="./car4-preview.ts"></script>
  </body>
</html>
