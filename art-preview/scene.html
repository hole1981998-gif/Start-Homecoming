<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đường Về Nhà · nghiên cứu art direction</title>
  <style>
    body{margin:0;height:100vh;display:flex;flex-direction:column;background:#192830;color:#eae6dd;font:14px system-ui,sans-serif}
    header{padding:12px 16px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}
    h1{font-size:18px;margin:0}p{margin:0;color:#becaca}
    select{background:#31515a;color:#f8ebd4;border:1px solid #8aacaa;padding:5px}
    label{display:flex;align-items:center;gap:5px}
    main{flex:1;min-height:0;display:flex;justify-content:center;padding:0 12px 12px;box-sizing:border-box}
    .stage{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:5px}
    canvas{display:block;width:100%;height:100%}
    .review-hud{position:absolute;inset:0;pointer-events:none;color:#e5efeb;text-shadow:0 2px 3px #102028,0 0 7px #102028;font-variant-numeric:tabular-nums}
    .review-hud[hidden]{display:none}
    .review-hud .metric{position:absolute;top:22px;display:flex;flex-direction:column}
    .review-hud .metric strong{font-size:36px;line-height:1;letter-spacing:-1px}
    .review-hud .metric span{font-size:11px}.speed{left:18px}.distance{left:50%;transform:translateX(-50%);align-items:center}
    .distance strong{font-size:28px!important}.totals{position:absolute;top:22px;right:16px;display:grid;gap:9px;text-align:right;font-size:15px;font-weight:700}
    .totals span{font-size:11px;color:#e3d09a}.totals small{font-size:11px;font-weight:400}
    .resources{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);width:200px;height:170px;filter:drop-shadow(0 1px 2px #132129)}
    .resources svg{width:100%;height:100%;fill:none;stroke-linecap:round}.resources .track{stroke:#13282baa;stroke-width:7}
    .resources .fuel{stroke:#efcf85;stroke-width:5.5}.resources .hp{stroke:#a7d5bf;stroke-width:5.5}
    .resources .values{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:center;gap:13px;font-size:10px;font-weight:700}
    .cue{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 1px 2px #102029)}
    .cue[hidden]{display:none}
    .cue b{width:32px;height:32px;display:grid;place-items:center;border:1px solid currentColor;border-radius:8px;background:#17272bbd;font-size:20px}
    .cue span{font-size:10px;font-weight:700;margin-top:3px}.cue.water{color:#bcebf5}.cue.pothole{color:#ffd39b}
    .controls{position:absolute;bottom:0;left:0;right:0;padding:12px 8px 10px;background:#17272b99;font-size:10px;color:#c9d9d4;display:flex;gap:11px}
    @media(max-width:650px){header{gap:8px;padding:8px}.stage{max-width:100%}}
  </style>
</head>
<body>
  <header>
    <h1>Cảnh mẫu · art direction</h1>
    <p>Model và màu đang phát triển · chưa ghép vào gameplay</p>
    <label>Góc nhìn <select id="cameraMode"><option value="prototype">Theo camera prototype</option><option value="study">Thử góc art direction</option><option value="drive">Camera chạy thử 9:16</option></select></label>
    <label>Xe <select id="vehicleKind"><option value="car4">Ô tô 4 chỗ</option><option value="motorcycle">Xe máy</option><option value="motorbike">Mô tô</option><option value="car7">Ô tô 7 chỗ</option><option value="tricycle">Ba gác</option><option value="bus">Buýt</option><option value="truck">Tải</option><option value="container">Container</option></select></label>
    <label>Vùng <select id="biomeKind"><option value="city">Phố</option><option value="trees">Cây</option><option value="rice">Ruộng</option><option value="sea">Biển</option><option value="cliffs">Vách</option></select></label>
    <label><input id="showHud" type="checkbox"> HUD mô phỏng</label>
    <p id="metrics"></p>
  </header>
  <main>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div id="reviewHud" class="review-hud" hidden aria-label="Bố cục HUD minh họa, không phải gameplay">
        <div class="metric speed"><strong>18,0</strong><span>km/h · preview</span></div>
        <div class="metric distance"><strong id="reviewDistance">0</strong><span>m</span></div>
        <div class="totals"><div><span>🏆</span> 1</div><div><span>◉</span> 280</div><div><span>♙</span> <span id="reviewOccupants">1/4</span></div><small id="reviewVehicleName">Ô tô 4 chỗ</small></div>
        <div class="resources">
          <svg viewBox="0 0 200 170" aria-hidden="true">
            <path class="track" d="M 87 144 C 45 129 17 92 21 38"/><path class="fuel" d="M 87 144 C 45 129 17 92 21 38"/>
            <path class="track" d="M 113 144 C 155 129 183 92 179 38"/><path class="hp" d="M 113 144 C 155 129 183 92 179 38"/>
          </svg>
          <div class="values"><span id="reviewFuel">⛽ 13 L</span><span id="reviewHp">⚒ 184 HP</span></div>
        </div>
        <div id="cueWater" class="cue water"><b>≋</b><span>NƯỚC</span></div>
        <div id="cuePothole" class="cue pothole"><b>!</b><span>Ổ GÀ</span></div>
        <div class="controls"><span>W/S tốc độ</span><span>A/D lái</span><span>Q/E rẽ</span><span>F đón</span></div>
      </div>
    </div>
  </main>
  <script type="module" src="./scene.ts"></script>
</body>
</html>
