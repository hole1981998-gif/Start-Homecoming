<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đường Về Nhà · world art gallery</title>
<style>body{margin:0;background:#192830;color:#eee8dc;font:14px system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px}h1{margin:0;font-size:18px}select{padding:5px;background:#30464d;color:#eee8dc;border:1px solid #738f94}main{display:grid;grid-template-columns:1.05fr 2fr;gap:12px;padding:0 12px 12px;height:calc(100vh - 70px);box-sizing:border-box}.view{position:relative;overflow:hidden;background:#596a6d;border-radius:6px}canvas{width:100%;height:100%;display:block}.view span{position:absolute;left:8px;top:8px;background:#18272dcc;padding:3px 6px}.sheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.gameplay{height:520px}.sheet{height:650px}}</style></head><body>
<header><h1>World art · essential pass</h1><label>Asset <select id="kind"><option value="water">Nước ngập</option><option value="pothole">Ổ gà</option><option value="cargo_crate">Hàng rơi · thùng</option><option value="cargo_barrel">Hàng rơi · phuy</option><option value="fuel">Xăng</option><option value="repair">Sửa xe</option><option value="barrier">Rào</option><option value="fallen_tree">Cây đổ (dự phòng)</option><option value="train">Tàu</option><option value="ambulance">Cứu thương</option><option value="police">Công an</option><option value="militia">Dân phòng</option><option value="vendor">Hàng rong</option><option value="accident">Tai nạn</option><option value="shop">Shop</option><option value="road">Mặt đường 4 m</option><option value="city">Nhà ven đường</option><option value="trees">Cây</option><option value="cliffs">Đồi/vách</option><option value="rice">Ruộng</option><option value="sea">Ven biển</option></select></label><label>LOD <select id="lod"><option value="near">Near</option><option value="far">Far</option></select></label><label>Biến thể phố <select id="variant"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></label></header>
<main><div class="view gameplay"><span>Góc gameplay 9:16</span><canvas id="gameplay"></canvas></div><div class="sheet"><div class="view"><span>Rear</span><canvas id="rear"></canvas></div><div class="view"><span>Front</span><canvas id="front"></canvas></div><div class="view"><span>Side</span><canvas id="side"></canvas></div><div class="view"><span>Top</span><canvas id="top"></canvas></div></div></main><script type="module" src="./world-gallery.ts"></script></body></html>
